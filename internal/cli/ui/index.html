<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>gst</title>
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
<div class="app">
  <aside class="rail">
    <header class="rail-head">
      <span class="brand">gst</span>
      <span id="summary" class="summary"></span>
    </header>
    <nav id="machines" class="machines" aria-label="Machines"></nav>
    <footer class="rail-foot">
      <span id="software"></span>
      <span class="keys"><kbd>J</kbd><kbd>K</kbd> to move</span>
    </footer>
  </aside>

  <main class="main">
    <div id="alert" class="alert" role="alert" hidden></div>
    <header id="head" class="head"></header>
    <div id="detail" class="detail"></div>
  </main>

  <aside class="side" aria-label="The mesh and the selected machine">
    <svg id="ring" class="ring" role="img" aria-label="Machines of the mesh and the running links between them"></svg>
    <section id="directs" class="directs" aria-label="Direct links of the mesh" hidden></section>
    <dl id="props" class="props"></dl>
  </aside>
</div>
</body>
</html>
