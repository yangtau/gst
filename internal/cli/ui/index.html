<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>gst</title>
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
<header class="top">
  <div class="top-in">
    <span class="brand">gst</span>
    <span id="summary" class="summary"></span>
  </div>
</header>
<div id="alert" class="alert" role="alert" hidden></div>
<main class="page">
  <section id="overview" class="overview" aria-label="This machine and the network">
    <dl id="self" class="facts"></dl>
    <svg id="ring" class="ring" role="img" aria-label="Machines of the network and the running links between them"></svg>
  </section>
  <section aria-label="Machines">
    <h2 class="section-title">Machines <span id="count" class="faint"></span></h2>
    <ul id="machines" class="machines"></ul>
  </section>
</main>
<footer class="foot"><span id="software"></span></footer>
</body>
</html>
