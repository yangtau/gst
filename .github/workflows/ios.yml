# Builds the iOS app with Xcode, for a device and for the simulator, runs
# its tests in the simulator, and takes screenshots of it there, which
# the run keeps as an artifact. See ios/README.md.
name: iOS

on:
  push:
    paths:
      - .github/workflows/ios.yml
      - ios/**
      - internal/**
      - go.mod
      - go.sum
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Generate the project
        run: |
          xcodebuild -version
          brew install xcodegen
          make ios
      - name: Build for a device
        run: |
          xcodebuild -project ios/Gst.xcodeproj -scheme Gst -configuration Release \
            -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO -quiet build
      - name: Test in the simulator
        if: always()
        run: |
          set -o pipefail
          xcodebuild -project ios/Gst.xcodeproj -scheme Gst -derivedDataPath ios/build/derived \
            -destination "id=$(ios/simulator.sh),arch=arm64" test |
            grep -E "^Test (Case|Suite) .*(passed|failed)|Executed [0-9]+ tests|error:|warning:|\*\* TEST"
      - name: Take screenshots
        run: |
          ios/screenshots.sh ios/build/derived/Build/Products/Debug-iphonesimulator/gst.app ios/build/screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ios/build/screenshots
