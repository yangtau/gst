# Builds the iOS app with Xcode, for a device and for the simulator, and
# runs its tests in the simulator. See ios/README.md.
name: iOS

on:
  push:
    paths:
      - .github/workflows/ios.yml
      - ios/**
      - internal/**
      - go.mod
      - go.sum
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Generate the project
        run: |
          xcodebuild -version
          brew install xcodegen
          make ios
      - name: Build for a device
        run: |
          xcodebuild -project ios/Gst.xcodeproj -scheme Gst -configuration Release \
            -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO -quiet build
      - name: Test in the simulator
        if: always()
        run: |
          xcodebuild -project ios/Gst.xcodeproj -scheme Gst \
            -destination "id=$(ios/simulator.sh)" -quiet test
